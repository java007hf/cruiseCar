# CruiseCar Python server - Docker Compose.
#
# Usage:
#   docker compose up server
#
# The SQLite DB lives in the `server-data` named volume so it survives
# container restarts.

services:
  server:
    build:
      context: ..
      dockerfile: server/Dockerfile
    image: cruisecar-server:latest
    environment:
      CRUISECAR_DEPLOYMENT: full
      # Enable TURN after coturn is deployed. Use the same secret as coturn static-auth-secret.
      # CRUISECAR_TURN_URLS: "turn:116.62.32.90:3478?transport=udp,turn:116.62.32.90:3478?transport=tcp"
      # CRUISECAR_TURN_STATIC_AUTH_SECRET: "replace-with-a-long-random-secret"
      # CRUISECAR_TURN_TTL_SECONDS: "3600"
    ports:
      - "42110:42110"   # sender/receiver TCP control relay
      - "42112:42112"   # WebRTC signaling relay
      - "8088:8088"     # manager-api
      - "8089:8089"     # manager-web
    volumes:
      - server-data:/data
    restart: unless-stopped

volumes:
  server-data:
